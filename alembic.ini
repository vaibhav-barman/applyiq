# Alembic configuration. The database URL comes from app/core/config.py (DATABASE_URL),
# and logging is configured by env.py, so neither is set here.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Every new revision is linted and formatted, so unused template imports (sa, op) and
# style differences are fixed before CI sees them.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
