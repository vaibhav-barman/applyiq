[project]
name = "applyiq"
version = "0.1.0"
description = "AI job-application copilot with grounded drafts and human approval"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: calls a real model; skipped unless run with -m llm"]
addopts = "-m 'not llm' --import-mode=importlib"

[tool.coverage.run]
source = ["app"]
branch = true
